<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LET'S SHOOT THE DUCK</title>
    <meta name="description" content="A 2D retro arcade parody: answer questions, get ammo, shoot the duck." />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦆</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="app">
      <div id="stage">
        <canvas id="game" width="960" height="540" aria-label="Game canvas"></canvas>
        <div id="ui"></div>
      </div>
      <p class="rotate-hint">↻ ROTATE YOUR PHONE FOR A BIGGER SCREEN</p>
      <noscript>This game needs JavaScript.</noscript>
    </main>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
